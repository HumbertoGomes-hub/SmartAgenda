<!doctype html>
<html lang="pt-BR" data-sessao="verificando">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7ed" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Agenda | Painel</title>
    <link rel="icon" href="data:," data-empresa-icone />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/site.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/agenda.css" />
    <script src="../js/admin/api-admin-exemplo.js" defer></script>
    <script src="../js/admin/marca.js" defer></script>
    <script src="../js/admin/painel.js" defer></script>
    <script src="../js/admin/agendamento.js" defer></script>
    <script src="../js/admin/agenda.js" defer></script>
  </head>
  <body class="corpo-painel">
    <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>

    <div class="painel">
      <!-- início: menu lateral do painel (vira partial no EJS; cada item com
           data-permissao só é desenhado se o perfil puder executar a ação) -->
      <aside class="lateral">
        <div class="lateral__topo">
          <a class="marca" href="index.html" translate="no">
            <img data-empresa-logo alt="" width="34" height="34" hidden />
            <span><span data-empresa-nome></span><span class="marca__apoio">Painel da equipe</span></span>
          </a>
          <button class="lateral__alternar" type="button" aria-expanded="false" aria-controls="gaveta" aria-label="Abrir menu">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 6h14M3 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div id="gaveta" class="lateral__gaveta">
          <nav class="menu-painel" aria-label="Painel">
            <ul>
              <li>
                <a class="menu-painel__link" href="index.html">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-4.5h-5V17H4a1 1 0 0 1-1-1z"/></svg>
                  Início
                </a>
              </li>
              <li data-permissao="agenda">
                <a class="menu-painel__link" href="pedidos.html">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 5 4h10l2 7.5V16H3z"/><path d="M3 11.5h4l1 2h4l1-2h4"/></svg>
                  Pedidos
                </a>
              </li>
              <li data-permissao="agenda">
                <a class="menu-painel__link" href="agenda.html" aria-current="page">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4"/></svg>
                  Agenda
                </a>
              </li>
              <li data-permissao="servicos">
                <span class="menu-painel__link" aria-disabled="true">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7l7 7-7 7-7-7z"/><circle cx="7" cy="7" r="1.3"/></svg>
                  Serviços <span class="menu-painel__breve">Em breve</span>
                </span>
              </li>
              <li data-permissao="portfolio">
                <span class="menu-painel__link" aria-disabled="true">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="m3 13 4-4 4 4 2-2 4 4"/><circle cx="13" cy="8" r="1.3"/></svg>
                  Portfólio <span class="menu-painel__breve">Em breve</span>
                </span>
              </li>
              <li data-permissao="relatorio">
                <span class="menu-painel__link" aria-disabled="true">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h14M5.5 14V9M10 14V5M14.5 14v-3"/></svg>
                  Relatório <span class="menu-painel__breve">Em breve</span>
                </span>
              </li>
              <li data-permissao="configuracao">
                <span class="menu-painel__link" aria-disabled="true">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg>
                  Configurações <span class="menu-painel__breve">Em breve</span>
                </span>
              </li>
              <li data-permissao="usuarios">
                <span class="menu-painel__link" aria-disabled="true">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="7" r="3"/><path d="M2.5 17c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5M13.5 4.2a3 3 0 0 1 0 5.6M15.5 12.8c1.2.7 2 2 2.2 4.2"/></svg>
                  Usuários <span class="menu-painel__breve">Em breve</span>
                </span>
              </li>
            </ul>
          </nav>

          <div class="lateral__usuario">
            <p class="lateral__nome" data-usuario-nome></p>
            <p class="lateral__perfil" data-usuario-perfil></p>
            <div class="lateral__acoes">
              <button class="botao botao--contorno botao--pequeno" type="button" data-sair>Sair</button>
              <a class="ligacao lateral__site" href="../index.html">Ver o site</a>
            </div>
          </div>
        </div>
      </aside>
      <!-- fim: menu lateral do painel -->

      <main id="conteudo" class="painel__principal">
        <p class="alerta painel__aviso" data-aviso-painel role="alert"></p>

        <div class="agenda-topo">
          <h1 tabindex="-1"><span class="visualmente-oculto">Agenda: </span><span id="agenda-periodo">Agenda</span></h1>
          <div class="agenda-controles">
            <button id="agenda-hoje" class="controle" type="button">Hoje</button>
            <button id="agenda-anterior" class="controle" type="button" aria-label="Período anterior">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11 4 6 9l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="agenda-seguinte" class="controle" type="button" aria-label="Próximo período">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m7 4 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="segmentado" role="group" aria-label="Visão da agenda">
              <button type="button" data-visao="mes" aria-pressed="true">Mês</button>
              <button type="button" data-visao="semana" aria-pressed="false">Semana</button>
              <button type="button" data-visao="dia" aria-pressed="false">Dia</button>
            </div>
            <button id="agenda-novo" class="botao" type="button">Novo agendamento</button>
          </div>
        </div>

        <div class="agenda-filtros">
          <fieldset class="filtro-status">
            <legend>Mostrar</legend>
            <label class="filtro-chip">
              <input type="checkbox" name="filtro-status" value="PENDENTE" checked />
              <span class="filtro-chip__amostra" data-status="PENDENTE" aria-hidden="true"></span>
              Pendente
            </label>
            <label class="filtro-chip">
              <input type="checkbox" name="filtro-status" value="AGUARDANDO_CLIENTE" checked />
              <span class="filtro-chip__amostra" data-status="AGUARDANDO_CLIENTE" aria-hidden="true"></span>
              Aguardando cliente
            </label>
            <label class="filtro-chip">
              <input type="checkbox" name="filtro-status" value="CONFIRMADO" checked />
              <span class="filtro-chip__amostra" data-status="CONFIRMADO" aria-hidden="true"></span>
              Confirmado
            </label>
            <label class="filtro-chip">
              <input type="checkbox" name="filtro-status" value="CONCLUIDO" checked />
              <span class="filtro-chip__amostra" data-status="CONCLUIDO" aria-hidden="true"></span>
              Concluído
            </label>
            <label class="filtro-chip">
              <input type="checkbox" name="filtro-status" value="NAO_COMPARECEU" checked />
              <span class="filtro-chip__amostra" data-status="NAO_COMPARECEU" aria-hidden="true"></span>
              Não compareceu
            </label>
            <label class="filtro-chip">
              <input type="checkbox" name="filtro-status" value="LIBERADOS" />
              <span class="filtro-chip__amostra" data-status="LIBERADOS" aria-hidden="true"></span>
              Desmarcados e expirados
            </label>
          </fieldset>
          <label class="filtro-servico">
            Serviço
            <select id="filtro-servico">
              <option value="">Todos os serviços</option>
            </select>
          </label>
        </div>

        <p id="erro-agenda" class="alerta painel__aviso" role="alert"></p>

        <div id="calendario" class="calendario-painel" aria-live="polite"></div>
      </main>

      <!-- Detalhe de um agendamento -->
      <dialog id="dialogo-detalhe" class="dialogo" aria-labelledby="detalhe-titulo">
        <div class="dialogo__forma">
          <div class="dialogo__topo">
            <div>
              <h2 id="detalhe-titulo"></h2>
              <div id="detalhe-status" class="detalhe__status"></div>
            </div>
            <button class="dialogo__fechar" type="button" data-fechar aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m4.5 4.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          </div>
          <div class="dialogo__corpo">
            <div id="detalhe-corpo"></div>
            <p id="alerta-detalhe" class="alerta" role="alert"></p>
          </div>
          <div id="detalhe-acoes" class="dialogo__acoes"></div>
        </div>
      </dialog>

      <!-- Novo agendamento, editar e realocar -->
      <dialog id="dialogo-formulario" class="dialogo dialogo--largo" aria-labelledby="formulario-titulo">
        <form id="form-agendamento" class="dialogo__forma form-agenda" novalidate>
          <div class="dialogo__topo">
            <h2 id="formulario-titulo">Novo agendamento</h2>
            <button class="dialogo__fechar" type="button" data-fechar aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m4.5 4.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          </div>
          <div class="dialogo__corpo">
            <p id="cliente-fixo" class="cliente-fixo" hidden></p>
            <fieldset id="campos-cliente" class="form-linha">
              <legend class="visualmente-oculto">Cliente</legend>
              <div class="campo">
                <label for="campo-nome">Nome do cliente</label>
                <input id="campo-nome" type="text" autocomplete="off" spellcheck="false" aria-describedby="campo-nome-erro" />
                <span id="campo-nome-erro" class="campo__erro"></span>
              </div>
              <div class="campo">
                <label for="campo-telefone">Telefone com DDD</label>
                <input id="campo-telefone" type="tel" inputmode="numeric" autocomplete="off" placeholder="(11) 90000-0000" aria-describedby="campo-telefone-erro" />
                <span id="campo-telefone-erro" class="campo__erro"></span>
              </div>
            </fieldset>

            <fieldset class="form-servicos" aria-describedby="servicos-erro">
              <legend>Serviços</legend>
              <div id="opcoes-servicos"></div>
              <span id="servicos-erro" class="campo__erro"></span>
            </fieldset>

            <div class="form-linha">
              <div class="campo">
                <label for="campo-data">Data</label>
                <input id="campo-data" type="date" aria-describedby="campo-data-erro" />
                <span id="campo-data-erro" class="campo__erro"></span>
              </div>
              <div class="campo">
                <label for="campo-hora">Hora</label>
                <select id="campo-hora" aria-describedby="campo-hora-erro"></select>
                <span id="campo-hora-erro" class="campo__erro"></span>
              </div>
            </div>
            <p id="resumo-horario" class="form-resumo" aria-live="polite"></p>
            <p id="aviso-horario" class="aviso" aria-live="polite"></p>

            <div class="campo">
              <label for="campo-modelo">Modelo do veículo <span class="campo__opcional">(opcional)</span></label>
              <input id="campo-modelo" type="text" autocomplete="off" />
            </div>
            <div class="campo">
              <label for="campo-observacoes">Observações <span class="campo__opcional">(opcional)</span></label>
              <textarea id="campo-observacoes" rows="2"></textarea>
            </div>
            <p id="alerta-formulario" class="alerta" role="alert"></p>
          </div>
          <div class="dialogo__acoes dialogo__acoes--fim">
            <button class="botao botao--contorno" type="button" data-fechar>Fechar</button>
            <button id="botao-salvar" class="botao" type="submit">Criar agendamento</button>
          </div>
        </form>
      </dialog>

      <!-- Confirmação antes de desmarcar -->
      <dialog id="dialogo-desmarcar" class="dialogo" aria-labelledby="desmarcar-titulo" aria-describedby="desmarcar-texto">
        <div class="dialogo__forma">
          <div class="dialogo__topo">
            <h2 id="desmarcar-titulo">Desmarcar o horário?</h2>
          </div>
          <div class="dialogo__corpo">
            <p id="desmarcar-texto"></p>
            <p id="alerta-desmarcar" class="alerta" role="alert"></p>
          </div>
          <div class="dialogo__acoes dialogo__acoes--fim">
            <button class="botao botao--contorno" type="button" data-fechar>Manter horário</button>
            <button id="desmarcar-confirmar" class="botao-perigo botao-perigo--cheio" type="button">Desmarcar horário</button>
          </div>
        </div>
      </dialog>
    </div>

    <div id="aviso-acao" class="aviso-acao" role="status" hidden></div>
  </body>
</html>
